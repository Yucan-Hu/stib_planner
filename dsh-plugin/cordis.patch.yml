# dsh-stib-planner — bundle 层
#
# 已按本机实际路径填好。部署到其他机器时改这三项即可：
#   python     —— Python 解释器（绝对路径或 PATH 上的名字）
#   plannerDir —— stib-planner 包目录（其下应有 stib/ 子目录）
#   dataDir    —— 基因组 FASTA 缓存目录
#
# 契约要点（依据官方 bundle 层文档）：
#   - 顶层是 YAML 数组
#   - 每个 row 必须显式 id（无 id 会每次读取生成新 id → 配置一改就重挂）
#   - !!js 仅在 config 与 disabled 中合法
#   - patch 会**整体替换**目标 row 的 config，不是深合并

- insert:
    - id: stib-planner
      name: dsh-stib-planner
      config:
        # ⚠️ 以下三项**必须按你的机器修改**（这是占位符，不是可用值）。
        #    python     : Python 3.10+ 的绝对路径（或 PATH 上的 python / python3）
        #    plannerDir : 插件安装目录 —— 其下应有 stib/ 子目录
        #                 （npm 包自带了 Python 代码，所以指向插件目录即可）
        #    dataDir    : 基因组缓存目录（可留空，默认 plannerDir/data）
        python: python
        plannerDir: /绝对路径/to/dsh-plugin
        dataDir: /绝对路径/to/dsh-plugin/data
        timeoutMs: 300000
        maxOutputBytes: 2097152
