# dsh-stib-planner — bundle 层
#
# ★ 默认**不需要任何配置**：Python 代码随包发布在 `stib/`，
#   插件用 `import.meta.url` 自定位；Python 解释器也会自动探测
#   （PATH 上的 python3/python，再到 DSH 自带的运行时，取第一个 3.10+）。
#
# 只有下面这些情况才需要取消注释并填写：
#   - 想指定某个解释器（例如机器上装了多个 Python）
#   - 想改用仓库里的另一份 Python 代码（其下应有 `stib/`）
#   - 想把基因组缓存放到别处
#
# 契约要点（依据官方 bundle 层文档）：
#   - 顶层是 YAML 数组
#   - 每个 row 必须显式 id（无 id 会每次读取生成新 id → 配置一改就重挂）
#   - !!js 仅在 config 与 disabled 中合法
#   - patch 会**整体替换**目标 row 的 config，不是深合并

- insert:
    - id: stib-planner
      name: dsh-stib-planner
      config:
        # python: python3
        # plannerDir: /path/to/dir-containing-stib
        # dataDir: /path/to/genome-cache
        timeoutMs: 300000
        maxOutputBytes: 2097152
