# psh43 载体构建规范 —— 转座子臂边界与 cargo 放置
#
# ═══════════════════════════════════════════════════════════════════════════
# 数据来源
#   testdata/psh4300C.dna —— 课题组提供的 SnapGene 文件（10,040 bp，环状）
#   解析：stib/buildout.py::read_snapgene（复刻 Biopython SnapGeneIO 逻辑）
#   独立验证：SOP 引物 GA725 / GA778 在序列中唯一命中，位置与预期拓扑一致
#
# ⚠️ 本文件由 stib/yamlmini.py 读取（为保持零第三方依赖）。
#    支持：嵌套映射、列表、块标量(> |)、行内 [a, b] / {k: v}。
#    **不支持跨行的行内映射** —— 需要附加字段时另起一行缩进，
#    不要把 {…} 拆成两行，也不要靠空格对齐列（改一个数字就要重排）。
# ═══════════════════════════════════════════════════════════════════════════

meta:
  name: psh43 系列（Cas12k–TnsC 融合）
  version: "0.2"
  backbone_file: testdata/psh4300C.dna
  backbone_length: 10040
  topology: circular
  source_protocol: 039_STIB 载体构建.md（2026-08-11，Yucan Hu）
  source_paper: Cell Systems 2026, 101650. doi:10.1016/j.cels.2026.101650

